<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebXR Star Particle System</title>
    <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <style>
        body { margin: 0; background: #050505; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        canvas { display: block; }
        
        /* 隐藏原始视频 */
        #video-input { position: fixed; transform: scaleX(-1); visibility: hidden; width: 160px; height: 120px; }

        /* 磨砂玻璃 UI */
        .glass-ui {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 200px;
            height: 200px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 100;
        }

        .controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 101;
        }

        button {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid white;
            color: white;
            padding: 10px 20px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: 0.3s;
        }

        button:hover { background: rgba(255, 255, 255, 0.3); }

        #status { font-size: 12px; margin-top: 60px; text-align: center; }
    </style>
</head>
<body>

<video id="video-input"></video>

<div class="glass-ui">
    <div id="status">检测中...</div>
</div>

<div class="controls">
    <button onclick="toggleCamera()">开启/关闭 摄像头</button>
    <button onclick="toggleFullscreen()">全屏切换</button>
</div>

<script id="vertexShader" type="x-shader/x-vertex">
    uniform float uTime;
    uniform float uExpand;
    uniform vec3 uCenter;
    uniform float uScale;

    varying vec3 vColor;
    varying float vDistance;

    // 伪随机噪声
    float hash(float n) { return fract(sin(n) * 43758.5453123); }

    void main() {
        // 原始星形分布逻辑 (Astroloid: x^(2/3) + y^(2/3) = R^(2/3))
        // 这里的 position 是 BufferGeometry 传入的初始分布
        vec3 pos = position;

        // 手势缩放与扩散
        pos *= (uScale + uExpand * 0.5);

        // 自转
        float angleY = uTime * 0.2;
        float angleZ = uTime * 0.1;
        mat3 rotY = mat3(cos(angleY), 0, sin(angleY), 0, 1, 0, -sin(angleY), 0, cos(angleY));
        mat3 rotZ = mat3(cos(angleZ), -sin(angleZ), 0, sin(angleZ), cos(angleZ), 0, 0, 0, 1);
        pos = rotY * rotZ * pos;

        // 加上手部中心偏移
        pos += uCenter;

        // 噪声抖动
        pos.x += sin(uTime * 2.0 + position.y * 10.0) * 0.05 * uExpand;
        pos.y += cos(uTime * 2.0 + position.x * 10.0) * 0.05 * uExpand;

        vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
        
        // 模拟星型亮度：越靠近角部或外围越亮（此处简化为距离计算）
        vDistance = length(position);
        vColor = mix(vec3(0.4, 0.7, 1.0), vec3(1.0, 1.0, 1.0), vDistance);

        gl_PointSize = (15.0 / -mvPosition.z) * (1.0 + vDistance);
        gl_Position = projectionMatrix * mvPosition;
    }
</script>

<script id="fragmentShader" type="x-shader/x-fragment">
    varying vec3 vColor;
    varying float vDistance;

    void main() {
        // 绘制圆形粒子
        float dist = distance(gl_PointCoord, vec2(0.5));
        if (dist > 0.5) discard;
        
        // 发光强度
        float strength = 1.0 - (dist * 2.0);
        strength = pow(strength, 3.0);

        gl_FragColor = vec4(vColor, strength);
    }
</script>

<script>
/** -----------------------------------------------------------
 * THREE.JS 场景初始化
 * ----------------------------------------------------------- */
let scene, camera, renderer, particles, material;
const PARTICLE_COUNT = 50000;

function initScene() {
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 5;

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // 创建粒子几何体
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(PARTICLE_COUNT * 3);

    for (let i = 0; i < PARTICLE_COUNT; i++) {
        // 算法生成四尖星形状 (Astroloid)
        const t = Math.random() * Math.PI * 2;
        const r = Math.pow(Math.random(), 0.5); // 向边缘聚集
        
        // 四尖星方程参数化
        const x = Math.pow(Math.abs(Math.cos(t)), 3.0) * Math.sign(Math.cos(t)) * r;
        const y = Math.pow(Math.abs(Math.sin(t)), 3.0) * Math.sign(Math.sin(t)) * r;
        const z = (Math.random() - 0.5) * 0.2 * (1.0 - r); // 中心稍厚

        positions[i * 3] = x * 2;
        positions[i * 3 + 1] = y * 2;
        positions[i * 3 + 2] = z * 2;
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

    // Shader 材质
    material = new THREE.ShaderMaterial({
        uniforms: {
            uTime: { value: 0 },
            uExpand: { value: 0 },
            uScale: { value: 1.0 },
            uCenter: { value: new THREE.Vector3(0, 0, 0) }
        },
        vertexShader: document.getElementById('vertexShader').textContent,
        fragmentShader: document.getElementById('fragmentShader').textContent,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false
    });

    particles = new THREE.Points(geometry, material);
    scene.add(particles);
}

/** -----------------------------------------------------------
 * MEDIAPIPE 手势识别
 * ----------------------------------------------------------- */
const videoElement = document.getElementById('video-input');
const statusText = document.getElementById('status');
let hands;

function initMediaPipe() {
    hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
        maxNumHands: 2,
        modelComplexity: 1,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
    });

    hands.onResults(onResults);

    const cameraUtils = new Camera(videoElement, {
        onFrame: async () => {
            await hands.send({ image: videoElement });
        },
        width: 640,
        height: 480
    });
    cameraUtils.start();
}

// 核心逻辑：手势映射
function onResults(results) {
    if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        statusText.innerText = `检测到 ${results.multiHandLandmarks.length} 只手`;
        
        let centerX = 0, centerY = 0, avgDistance = 0;
        
        // 计算双手中心点与张开程度
        results.multiHandLandmarks.forEach(landmarks => {
            // 关键点 0 为手腕, 8 为食指尖, 4 为大拇指
            const wrist = landmarks[0];
            const indexTip = landmarks[8];
            const thumbTip = landmarks[4];

            centerX += (1.0 - wrist.x - 0.5) * 10; // 镜像处理并缩放
            centerY += (0.5 - wrist.y) * 10;

            // 简单的张开程度计算：拇指与食指距离
            const dx = indexTip.x - thumbTip.x;
            const dy = indexTip.y - thumbTip.y;
            avgDistance += Math.sqrt(dx*dx + dy*dy);
        });

        const count = results.multiHandLandmarks.length;
        
        // 更新 Shader Uniforms
        // 目标：双手中心平移
        material.uniforms.uCenter.value.lerp(new THREE.Vector3(centerX / count, centerY / count, 0), 0.1);
        
        // 目标：张开 -> 扩散，合拢 -> 凝聚
        // 阈值：通常 0.1 以下为合拢，0.2 以上为张开
        const spreadBase = avgDistance / count;
        const targetExpand = THREE.MathUtils.mapLinear(spreadBase, 0.05, 0.25, -0.5, 2.0);
        const targetScale = THREE.MathUtils.mapLinear(spreadBase, 0.05, 0.25, 0.5, 1.5);
        
        material.uniforms.uExpand.value = THREE.MathUtils.lerp(material.uniforms.uExpand.value, targetExpand, 0.1);
        material.uniforms.uScale.value = THREE.MathUtils.lerp(material.uniforms.uScale.value, targetScale, 0.1);

    } else {
        statusText.innerText = "等待手势...";
        // 无手时缓慢重置
        material.uniforms.uExpand.value = THREE.MathUtils.lerp(material.uniforms.uExpand.value, 0, 0.05);
        material.uniforms.uScale.value = THREE.MathUtils.lerp(material.uniforms.uScale.value, 1.0, 0.05);
    }
}

/** -----------------------------------------------------------
 * 循环与工具函数
 * ----------------------------------------------------------- */
function animate() {
    requestAnimationFrame(animate);
    material.uniforms.uTime.value += 0.01;
    renderer.render(scene, camera);
}

function toggleCamera() {
    const stream = videoElement.srcObject;
    if (stream) {
        stream.getTracks().forEach(track => track.stop());
        videoElement.srcObject = null;
    } else {
        location.reload(); // 简易重开
    }
}

function toggleFullscreen() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
    } else {
        document.exitFullscreen();
    }
}

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// 启动
initScene();
initMediaPipe();
animate();

</script>
</body>
</html>
