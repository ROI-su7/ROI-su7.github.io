<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 星型手势粒子系统 - 描边版</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        #video-preview {
            position: absolute;
            top: 10px; left: 10px;
            width: 160px; height: 120px;
            border-radius: 8px;
            opacity: 0.7;
            z-index: 2;
            transform: scaleX(-1); /* 镜像显示 */
        }
        #status-text {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.9);
            font-family: 'Segoe UI', sans-serif;
            font-size: 3rem;
            font-weight: 300;
            letter-spacing: 4px;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.6);
            pointer-events: none;
            z-index: 3;
        }
        #fullscreen-btn {
            position: absolute;
            bottom: 20px; right: 20px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 30px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            z-index: 3;
        }
    </style>
</head>
<body>
    <video id="video-preview" autoplay playsinline></video>
    <div id="status-text">CORE</div>
    <button id="fullscreen-btn">ENTER FULLSCREEN</button>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { UnrealBloomPass } from 'https://unpkg.com/three@0.160.0/examples/jsm/postprocessing/UnrealBloomPass.js';
        import { EffectComposer } from 'https://unpkg.com/three@0.160.0/examples/jsm/postprocessing/EffectComposer.js';
        import { RenderPass } from 'https://unpkg.com/three@0.160.0/examples/jsm/postprocessing/RenderPass.js';

        let scene, camera, renderer, composer;
        let particleSystem, starOutline;
        let targetPos = new THREE.Vector3();
        let spreadFactor = 1.0;
        let isHandDetected = false;

        // --- 1. Three.js 初始化 ---
        function initThree() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 20;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            // 后期处理 - 辉光效果
            const renderScene = new RenderPass(scene, camera);
            const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
            bloomPass.threshold = 0.1;
            bloomPass.strength = 2.0; // 调整辉光强度
            bloomPass.radius = 0.5;
            composer = new EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloomPass);

            createParticles();
            createStarOutline();
            animate();
        }

        // --- 2. 创建粒子系统 ---
        function createParticles() {
            const particleCount = 5000;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const velocities = new Float32Array(particleCount * 3); // 用于简易物理

            for (let i = 0; i < particleCount; i++) {
                positions[i * 3] = (Math.random() - 0.5) * 50;
                positions[i * 3 + 1] = (Math.random() - 0.5) * 50;
                positions[i * 3 + 2] = (Math.random() - 0.5) * 50;
                velocities[i * 3] = (Math.random() - 0.5) * 0.02;
                velocities[i * 3 + 1] = (Math.random() - 0.5) * 0.02;
                velocities[i * 3 + 2] = (Math.random() - 0.5) * 0.02;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('velocity', new THREE.BufferAttribute(velocities, 3));

            const material = new THREE.PointsMaterial({
                size: 0.15,
                color: 0x00ffff, // 青色
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending,
            });

            particleSystem = new THREE.Points(geometry, material);
            scene.add(particleSystem);
        }

        // --- 3. 创建星形描边 ---
        function createStarOutline() {
            const points = [];
            const outerRadius = 10;
            const innerRadius = 4;
            const numPoints = 5;

            for (let i = 0; i < numPoints * 2; i++) {
                const angle = (i / (numPoints * 2)) * Math.PI * 2 - Math.PI / 2; // 从顶部开始
                const radius = i % 2 === 0 ? outerRadius : innerRadius;
                points.push(new THREE.Vector3(Math.cos(angle) * radius, Math.sin(angle) * radius, 0));
            }
            // 闭合路径
            points.push(points[0].clone());

            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const material = new THREE.LineBasicMaterial({ 
                color: 0xffffff, // 白色描边
                linewidth: 2,
                transparent: true,
                opacity: 0.9,
                blending: THREE.AdditiveBlending
            });

            starOutline = new THREE.Line(geometry, material);
            scene.add(starOutline);
        }

        // --- 4. 动画循环 ---
        function animate() {
            requestAnimationFrame(animate);

            if (!isHandDetected) {
                // 手未检测到时，粒子自由漂浮
                const positions = particleSystem.geometry.attributes.position.array;
                const velocities = particleSystem.geometry.attributes.velocity.array;
                for(let i=0; i<positions.length; i+=3){
                    positions[i] += velocities[i];
                    positions[i+1] += velocities[i+1];
                    positions[i+2] += velocities[i+2];
                    // 边界检查，让粒子在一定范围内循环
                    if(Math.abs(positions[i]) > 30) velocities[i] *= -1;
                    if(Math.abs(positions[i+1]) > 30) velocities[i+1] *= -1;
                    if(Math.abs(positions[i+2]) > 30) velocities[i+2] *= -1;
                }
                particleSystem.geometry.attributes.position.needsUpdate = true;

                // 星形缓慢旋转
                starOutline.rotation.z += 0.005;
                starOutline.scale.lerp(new THREE.Vector3(1, 1, 1), 0.05); // 回复默认大小
                starOutline.position.lerp(new THREE.Vector3(0,0,0), 0.05); // 回复中心位置

            } else {
                // 手检测到时，粒子聚集并跟随
                particleSystem.position.lerp(targetPos, 0.1);
                starOutline.position.lerp(targetPos, 0.1);

                const baseScale = 0.5; // 基础大小
                const targetScale = baseScale + spreadFactor * 3; // 根据手势计算目标大小
                
                // 星形缩放
                starOutline.scale.lerp(new THREE.Vector3(targetScale, targetScale, targetScale), 0.1);
                // 星形旋转
                starOutline.rotation.z += 0.01 + spreadFactor * 0.02;

                // 粒子向星形聚集的简单逻辑 (可优化为更复杂的引力场)
                const positions = particleSystem.geometry.attributes.position.array;
                 for(let i=0; i<positions.length; i+=3){
                    // 简单的向中心聚集
                    positions[i] += (0 - positions[i]) * (0.05 + spreadFactor * 0.05);
                    positions[i+1] += (0 - positions[i+1]) * (0.05 + spreadFactor * 0.05);
                    positions[i+2] += (0 - positions[i+2]) * (0.05 + spreadFactor * 0.05);
                }
                particleSystem.geometry.attributes.position.needsUpdate = true;
            }

            // 使用 composer 渲染以获得辉光效果
            composer.render();
        }

        // --- 5. MediaPipe Hands 初始化 ---
        const videoElement = document.getElementById('video-preview');
        const statusText = document.getElementById('status-text');

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });
        hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.6 });

        hands.onResults((results) => {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                isHandDetected = true;
                const landmarks = results.multiHandLandmarks[0];

                // 计算手掌中心 (使用中指根部和手腕中点)
                const palmX = (landmarks[9].x + landmarks[0].x) / 2;
                const palmY = (landmarks[9].y + landmarks[0].y) / 2;
                
                // 映射到 3D 空间坐标 (需根据摄像头和屏幕比例微调)
                targetPos.set(
                    (0.5 - palmX) * 40, // X轴反向
                    (0.5 - palmY) * 25, // Y轴反向
                    0
                );

                // 计算拇指尖和食指尖的距离
                const thumbTip = landmarks[4];
                const indexTip = landmarks[8];
                const distance = Math.sqrt(
                    Math.pow(thumbTip.x - indexTip.x, 2) +
                    Math.pow(thumbTip.y - indexTip.y, 2)
                );
                // 归一化距离因子
                spreadFactor = Math.min(Math.max(distance - 0.05, 0) * 5, 1.5);

                // 更新文字和状态
                if (spreadFactor < 0.3) {
                    statusText.innerText = "CORE"; // 握拳/捏合
                } else if (spreadFactor > 0.8) {
                    statusText.innerText = "EXPAND"; // 张开
                } else {
                    statusText.innerText = "FLOW"; // 中间状态
                }

            } else {
                isHandDetected = false;
                statusText.innerText = "WAITING...";
            }
        });

        const cameraUtils = new Camera(videoElement, {
            onFrame: async () => { await hands.send({image: videoElement}); },
            width: 640, height: 480
        });
        cameraUtils.start();

        // --- 6. 事件监听 ---
        initThree();
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });
        document.getElementById('fullscreen-btn').onclick = () => {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        };
    </script>
</body>
</html>
