<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Mok 手势粒子风暴</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        #video-container { position: fixed; transform: scaleX(-1); opacity: 0.3; width: 240px; height: 180px; bottom: 10px; left: 10px; border-radius: 8px; overflow: hidden; border: 1px solid #333; }
        #status { position: fixed; top: 20px; left: 20px; color: #00ffff; font-family: monospace; pointer-events: none; text-shadow: 0 0 5px #00ffff; }
        canvas { display: block; }
    </style>
</head>
<body>
    <div id="status">正在加载 MediaPipe & Three.js...<br>等待手部进入画面</div>
    <div id="video-container"><video id="input-video"></video></div>

    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
    <script src="https://unpkg.com/@mediapipe/hands/hands.js"></script>
    <script src="https://unpkg.com/@mediapipe/camera_utils/camera_utils.js"></script>

    <script>
        const PARTICLE_COUNT = 16000;
        const statusEl = document.getElementById('status');
        
        // --- 1. 初始化 Three.js 场景 ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // --- 2. 形状坐标生成器 ---
        const Shapes = {
            // 球体
            sphere: () => {
                const arr = new Float32Array(PARTICLE_COUNT * 3);
                for(let i=0; i<PARTICLE_COUNT; i++) {
                    const phi = Math.acos(-1 + (2 * i) / PARTICLE_COUNT);
                    const theta = Math.sqrt(PARTICLE_COUNT * Math.PI) * phi;
                    arr[i*3] = Math.cos(theta) * Math.sin(phi) * 2;
                    arr[i*3+1] = Math.sin(theta) * Math.sin(phi) * 2;
                    arr[i*3+2] = Math.cos(phi) * 2;
                }
                return arr;
            },
            // 圆环
            torus: () => {
                const arr = new Float32Array(PARTICLE_COUNT * 3);
                for(let i=0; i<PARTICLE_COUNT; i++) {
                    const u = Math.random() * Math.PI * 2;
                    const v = Math.random() * Math.PI * 2;
                    const R = 2.5, r = 0.5;
                    arr[i*3] = (R + r * Math.cos(v)) * Math.cos(u);
                    arr[i*3+1] = (R + r * Math.cos(v)) * Math.sin(u);
                    arr[i*3+2] = r * Math.sin(v);
                }
                return arr;
            },
            // 星形
            star: () => {
                const arr = new Float32Array(PARTICLE_COUNT * 3);
                for(let i=0; i<PARTICLE_COUNT; i++) {
                    const t = Math.random() * Math.PI * 2;
                    const r = (i % 2 === 0 ? 3 : 1.2) * Math.pow(Math.random(), 0.2);
                    arr[i*3] = r * Math.cos(t);
                    arr[i*3+1] = r * Math.sin(t);
                    arr[i*3+2] = (Math.random() - 0.5) * 0.5;
                }
                return arr;
            },
            // 爱心
            heart: () => {
                const arr = new Float32Array(PARTICLE_COUNT * 3);
                for(let i=0; i<PARTICLE_COUNT; i++) {
                    const t = Math.random() * Math.PI * 2;
                    const x = 16 * Math.pow(Math.sin(t), 3);
                    const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
                    arr[i*3] = x * 0.15;
                    arr[i*3+1] = y * 0.15;
                    arr[i*3+2] = (Math.random() - 0.5) * 0.5;
                }
                return arr;
            },
            // 文字 "我是 Mok"
            text: () => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = 400; canvas.height = 100;
                ctx.fillStyle = 'white';
                ctx.font = 'bold 60px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('我是 Mok', 200, 70);
                const data = ctx.getImageData(0,0,400,100).data;
                const points = [];
                for(let i=0; i<data.length; i+=4) {
                    if(data[i] > 128) {
                        const px = (i/4) % 400;
                        const py = Math.floor((i/4) / 400);
                        points.push({x: (px-200)*0.03, y: (50-py)*0.03});
                    }
                }
                const arr = new Float32Array(PARTICLE_COUNT * 3);
                for(let i=0; i<PARTICLE_COUNT; i++) {
                    const p = points[i % points.length];
                    arr[i*3] = p.x; arr[i*3+1] = p.y; arr[i*3+2] = (Math.random()-0.5)*0.2;
                }
                return arr;
            }
        };

        // --- 3. 着色器材质 ---
        const particleShader = {
            uniforms: {
                uTime: { value: 0 },
                uTargetPos: { value: new THREE.Float32BufferAttribute(Shapes.sphere(), 3) },
                uTransition: { value: 0 },
                uHandPos: { value: new THREE.Vector3(0,0,0) },
                uHandVel: { value: new THREE.Vector3(0,0,0) },
                uScale: { value: 1.0 }
            },
            vertexShader: `
                uniform float uTime;
                uniform float uTransition;
                uniform vec3 uHandPos;
                uniform vec3 uHandVel;
                uniform float uScale;
                attribute vec3 target;
                attribute vec3 velocity;
                varying vec3 vColor;

                void main() {
                    // 基础物理模型：向目标点偏移
                    vec3 pos = mix(position, target, uTransition);
                    
                    // 深度拉伸反馈
                    pos *= uScale;

                    // 挥手风暴：受手部速度影响
                    float dist = distance(pos, uHandPos);
                    float force = Math.max(0.0, 1.5 - dist);
                    pos += uHandVel * force * 0.5;

                    // 简单的简谐浮动
                    pos.x += sin(uTime * 2.0 + position.y) * 0.05;
                    
                    vColor = vec3(0.0, 1.0, 1.0); // 青色
                    gl_PointSize = 2.5 * (1.0 / length(modelViewMatrix * vec4(pos, 1.0)).z);
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
                }
            `,
            fragmentShader: `
                varying vec3 vColor;
                void main() {
                    if(length(gl_PointCoord - vec2(0.5)) > 0.5) discard;
                    gl_FragColor = vec4(vColor, 0.8);
                }
            `
        };

        // 创建粒子系统
        const geometry = new THREE.BufferGeometry();
        const posArray = Shapes.sphere();
        geometry.setAttribute('position', new THREE.BufferAttribute(posArray.slice(), 3));
        geometry.setAttribute('target', new THREE.BufferAttribute(posArray.slice(), 3));
        
        const material = new THREE.ShaderMaterial(particleShader);
        const particles = new THREE.Points(geometry, material);
        scene.add(particles);

        // --- 4. 手势识别逻辑 ---
        let lastHandPos = new THREE.Vector3();
        let currentGesture = 'open';

        function detectGesture(landmarks) {
            const getDist = (a, b) => Math.hypot(landmarks[a].x - landmarks[b].x, landmarks[a].y - landmarks[b].y);
            
            // 简化版手势判断
            const isThumbUp = landmarks[4].y < landmarks[3].y && landmarks[8].y > landmarks[6].y;
            const isIndexUp = landmarks[8].y < landmarks[6].y && landmarks[12].y > landmarks[10].y;
            const isScissors = landmarks[8].y < landmarks[6].y && landmarks[12].y < landmarks[10].y && landmarks[16].y > landmarks[14].y;
            const isFist = landmarks[8].y > landmarks[6].y && landmarks[12].y > landmarks[10].y && landmarks[16].y > landmarks[14].y && landmarks[20].y > landmarks[18].y;
            const isOpen = landmarks[8].y < landmarks[6].y && landmarks[20].y < landmarks[18].y;

            if (isThumbUp) return 'heart';
            if (isScissors) return 'text';
            if (isFist) return 'torus';
            if (isIndexUp) return 'star';
            if (isOpen) return 'sphere';
            return currentGesture;
        }

        // --- 5. MediaPipe 配置 ---
        const hands = new Hands({
            locateFile: (file) => `https://unpkg.com/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7
        });

        hands.onResults((results) => {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const lm = results.multiHandLandmarks[0];
                
                // 1. 手势检测与形状切换
                const gesture = detectGesture(lm);
                if (gesture !== currentGesture) {
                    currentGesture = gesture;
                    const newTarget = Shapes[gesture]();
                    geometry.attributes.target.array.set(newTarget);
                    geometry.attributes.target.needsUpdate = true;
                    material.uniforms.uTransition.value = 0; // 重置插值动画
                    statusEl.innerHTML = `当前模式: ${gesture.toUpperCase()}<br>爆炸切换中...`;
                }

                // 2. 挥手速度计算
                const centerX = (lm[9].x - 0.5) * 10;
                const centerY = -(lm[9].y - 0.5) * 10;
                const currentPos = new THREE.Vector3(centerX, centerY, 0);
                const velocity = currentPos.clone().sub(lastHandPos);
                material.uniforms.uHandVel.value.lerp(velocity, 0.2);
                material.uniforms.uHandPos.value.copy(currentPos);
                lastHandPos.copy(currentPos);

                // 3. 深度推拉（基于手掌包围盒面积）
                const area = Math.abs(lm[5].x - lm[17].x) * Math.abs(lm[0].y - lm[9].y);
                material.uniforms.uScale.value = THREE.MathUtils.lerp(material.uniforms.uScale.value, 0.5 + area * 15, 0.1);

                // 插值动画
                if(material.uniforms.uTransition.value < 1.0) {
                    material.uniforms.uTransition.value += 0.05;
                }
            }
        });

        const videoElement = document.getElementById('input-video');
        const cameraUtils = new Camera(videoElement, {
            onFrame: async () => { await hands.send({image: videoElement}); },
            width: 640, height: 480
        });
        cameraUtils.start();

        // --- 6. 渲染循环 ---
        function animate() {
            requestAnimationFrame(animate);
            material.uniforms.uTime.value += 0.01;
            
            // 物理反馈：粒子位置向目标点缓慢靠近
            const pos = geometry.attributes.position.array;
            const tgt = geometry.attributes.target.array;
            for(let i=0; i<pos.length; i++) {
                pos[i] += (tgt[i] - pos[i]) * 0.1; // 丝滑物理跟随
            }
            geometry.attributes.position.needsUpdate = true;

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
