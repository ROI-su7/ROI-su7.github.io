<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Star Particle Gesture Interaction</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050505; font-family: 'Segoe UI', sans-serif; }
        canvas { display: block; }

        /* 玻璃拟态 UI */
        #ui-layer {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 220px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            color: white;
            z-index: 10;
            pointer-events: none;
        }

        h2 { margin: 0 0 10px 0; font-size: 18px; opacity: 0.9; }
        .status { font-size: 14px; margin-bottom: 5px; }
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            background: rgba(0, 255, 200, 0.2);
            color: #00ffc8;
            font-weight: bold;
            transition: all 0.3s;
        }

        video { display: none; } /* 隐藏原始视频流 */
    </style>
</head>
<body>

<div id="ui-layer">
    <h2>星型粒子系统</h2>
    <div class="status">状态: <span id="state-text" class="badge">等待识别...</span></div>
    <div class="status">指尖位置: <span id="pos-text">-</span></div>
    <p style="font-size: 12px; opacity: 0.6;">* 张开手掌扩张，握拳凝聚</p>
</div>

<video id="input_video"></video>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
    }
</script>

<script type="module">
import * as THREE from 'three';

/** -----------------------------------------------------------------
 * 1. 场景初始化
 * -------------------------------------------------------------- */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

camera.position.z = 5;

/** -----------------------------------------------------------------
 * 2. 自定义四角星粒子几何体
 * -------------------------------------------------------------- */
const PARTICLE_COUNT = 8000;
const starGeometry = new THREE.BufferGeometry();
const positions = new Float32Array(PARTICLE_COUNT * 3);
const randomness = new Float32Array(PARTICLE_COUNT);

// 核心顶点：上下左右前后
const anchors = [
    new THREE.Vector3(2, 0, 0), new THREE.Vector3(-2, 0, 0),
    new THREE.Vector3(0, 2, 0), new THREE.Vector3(0, -2, 0),
    new THREE.Vector3(0, 0, 0.2), new THREE.Vector3(0, 0, -0.2)
];

for (let i = 0; i < PARTICLE_COUNT; i++) {
    // 随机选择一条边
    const p1 = anchors[Math.floor(Math.random() * 4)]; // 选取四个长轴
    const p2 = anchors[4 + Math.floor(Math.random() * 2)]; // 选取短轴（中心点）
    
    // 使用 pow 使粒子更集中在尖端
    const t = Math.pow(Math.random(), 1.5); 
    const pos = new THREE.Vector3().learnVectors(p1, p2, t);
    
    // 添加少量噪点扩散
    pos.x += (Math.random() - 0.5) * 0.1;
    pos.y += (Math.random() - 0.5) * 0.1;
    pos.z += (Math.random() - 0.5) * 0.1;

    positions[i * 3] = pos.x;
    positions[i * 3 + 1] = pos.y;
    positions[i * 3 + 2] = pos.z;
    randomness[i] = Math.random();
}

starGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
starGeometry.setAttribute('aRandom', new THREE.BufferAttribute(randomness, 1));

// Shader 材质
const starMaterial = new THREE.ShaderMaterial({
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    uniforms: {
        uTime: { value: 0 },
        uScale: { value: 1.0 },
        uColor: { value: new THREE.Color(0x00ccff) }
    },
    vertexShader: `
        uniform float uTime;
        uniform float uScale;
        attribute float aRandom;
        varying float vBrightness;
        void main() {
            vec3 pos = position * uScale;
            // 基础旋转
            float angle = uTime * 0.5;
            float s = sin(angle);
            float c = cos(angle);
            pos.xy = mat2(c, -s, s, c) * pos.xy;
            
            vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
            gl_PointSize = (4.0 + aRandom * 4.0) * (30.0 / -mvPosition.z);
            gl_Position = projectionMatrix * mvPosition;
            vBrightness = aRandom;
        }
    `,
    fragmentShader: `
        varying float vBrightness;
        uniform vec3 uColor;
        void main() {
            float d = distance(gl_PointCoord, vec2(0.5));
            if (d > 0.5) discard;
            float strength = pow(1.0 - d/0.5, 2.0);
            gl_FragColor = vec4(uColor * (vBrightness + 0.5), strength);
        }
    `
});

const starSystem = new THREE.Points(starGeometry, starMaterial);
scene.add(starSystem);

/** -----------------------------------------------------------------
 * 3. MediaPipe 手势处理
 * -------------------------------------------------------------- */
const videoElement = document.getElementById('input_video');
const stateBadge = document.getElementById('state-text');
const posText = document.getElementById('pos-text');

let targetScale = 1.0;
let targetPos = new THREE.Vector3();

function onResults(results) {
    if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const hand = results.multiHandLandmarks[0];
        
        // 1. 位置映射 (使用食指指尖 Landmark 8)
        const indexTip = hand[8];
        // 转换 MediaPipe 坐标 (0~1) 到 Three.js (-5~5)
        targetPos.x = (indexTip.x - 0.5) * -10; // 镜像处理
        targetPos.y = (indexTip.y - 0.5) * -10;
        posText.innerText = `${targetPos.x.toFixed(1)}, ${targetPos.y.toFixed(1)}`;

        // 2. 状态检测 (计算大拇指尖 4 和食指尖 8 的距离)
        const dx = hand[4].x - hand[8].x;
        const dy = hand[4].y - hand[8].y;
        const dist = Math.sqrt(dx*dx + dy*dy);

        if (dist < 0.08) {
            targetScale = 0.4; // 凝聚
            stateBadge.innerText = "凝聚 (Condensed)";
            stateBadge.style.background = "rgba(255, 50, 50, 0.3)";
            stateBadge.style.color = "#ff5555";
            starMaterial.uniforms.uColor.value.set(0xffaa00);
        } else {
            targetScale = 1.8; // 扩张
            stateBadge.innerText = "扩张 (Expanded)";
            stateBadge.style.background = "rgba(0, 255, 200, 0.2)";
            stateBadge.style.color = "#00ffc8";
            starMaterial.uniforms.uColor.value.set(0x00ccff);
        }
    }
}

const hands = new Hands({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});
hands.setOptions({
    maxNumHands: 1,
    modelComplexity: 1,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
});
hands.onResults(onResults);

const cameraUtils = new Camera(videoElement, {
    onFrame: async () => { await hands.send({image: videoElement}); },
    width: 640,
    height: 480
});
cameraUtils.start();

/** -----------------------------------------------------------------
 * 4. 动画循环
 * -------------------------------------------------------------- */
function animate() {
    requestAnimationFrame(animate);
    
    const time = performance.now() * 0.001;
    starMaterial.uniforms.uTime.value = time;

    // 平滑插值 (Lerp)
    starSystem.position.lerp(targetPos, 0.1);
    starMaterial.uniforms.uScale.value = THREE.MathUtils.lerp(
        starMaterial.uniforms.uScale.value, 
        targetScale, 
        0.05
    );

    // 自动持续旋转
    starSystem.rotation.y += 0.01;
    starSystem.rotation.x = Math.sin(time) * 0.1; // 轻微倾斜

    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
