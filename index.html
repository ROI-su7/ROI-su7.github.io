<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 星型手势粒子系统</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050505; font-family: 'Segoe UI', sans-serif; }
        
        /* 1. 磨砂玻璃 UI */
        #ui-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            pointer-events: none;
        }

        .star-glass-panel {
            width: 500px; height: 500px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            /* 星型裁切 */
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        #gesture-text {
            color: #fff; font-size: 3rem; font-weight: 200;
            letter-spacing: 10px; text-shadow: 0 0 20px rgba(0,255,255,0.5);
            transition: all 0.3s ease;
        }

        /* 2. 全屏按钮 */
        #fullscreen-btn {
            position: absolute; bottom: 30px; right: 30px;
            padding: 12px 24px; background: rgba(255, 255, 255, 0.1);
            color: white; border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50px; cursor: pointer; pointer-events: auto;
            backdrop-filter: blur(5px); transition: 0.3s;
        }
        #fullscreen-btn:hover { background: rgba(255, 255, 255, 0.3); }

        canvas { display: block; }
        #video-preview { position: absolute; top: 10px; left: 10px; width: 120px; border-radius: 8px; opacity: 0.5; }
    </style>
</head>
<body>

    <video id="video-preview" autoplay playsinline></video>
    
    <div id="ui-container">
        <div class="star-glass-panel">
            <h1 id="gesture-text">LOADING...</h1>
        </div>
    </div>

    <button id="fullscreen-btn">ENTER FULLSCREEN</button>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- 初始化场景 ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        camera.position.z = 15;

        // --- 粒子系统设置 ---
        const particleCount = 15000;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const targetPositions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);

        // 生成星型路径点函数 (用于粒子聚集)
        const getStarPos = (t) => {
            const angle = t * Math.PI * 2;
            const r = (t * 10 % 2 < 1) ? 5 : 2.5; 
            return { x: Math.cos(angle) * r, y: Math.sin(angle) * r };
        };

        for (let i = 0; i < particleCount; i++) {
            positions[i * 3] = (Math.random() - 0.5) * 40;
            positions[i * 3 + 1] = (Math.random() - 0.5) * 40;
            positions[i * 3 + 2] = (Math.random() - 0.5) * 40;

            const star = getStarPos(Math.random());
            targetPositions[i * 3] = star.x;
            targetPositions[i * 3 + 1] = star.y;
            targetPositions[i * 3 + 2] = (Math.random() - 0.5) * 2;
            
            colors[i * 3] = 0.5; colors[i * 3 + 1] = 1.0; colors[i * 3 + 2] = 1.0;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('target', new THREE.BufferAttribute(targetPositions, 3));
        
        const material = new THREE.PointsMaterial({
            size: 0.03,
            vertexColors: false,
            color: 0x00ffff,
            transparent: true,
            blending: THREE.AdditiveBlending
        });

        const particleSystem = new THREE.Points(geometry, material);
        scene.add(particleSystem);

        // --- 手势识别逻辑 ---
        const videoElement = document.getElementById('video-preview');
        const gestureText = document.getElementById('gesture-text');
        let spreadFactor = 1.0;
        let targetPos = new THREE.Vector3(0, 0, 0);

        

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.7 });

        hands.onResults((results) => {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                
                // 1. 位置追踪 (平滑映射)
                const x = (0.5 - landmarks[9].x) * 30;
                const y = (0.5 - landmarks[9].y) * 20;
                targetPos.set(x, y, 0);

                // 2. 缩放控制 (计算大拇指和食指距离)
                const dist = Math.hypot(landmarks[8].x - landmarks[4].x, landmarks[8].y - landmarks[4].y);
                spreadFactor = dist * 8.0;

                // 3. 手势文字逻辑
                // 检查指尖高度判断手势
                const tip8 = landmarks[8].y, mid6 = landmarks[6].y;
                const tip12 = landmarks[12].y, mid10 = landmarks[10].y;
                
                if (tip8 > mid6 && tip12 > mid10) {
                    gestureText.innerText = "CORE";      // 手势1：握拳
                    material.color.setHex(0x00ffff);
                } else if (tip8 < mid6 && tip12 > mid10) {
                    gestureText.innerText = "POINTER";   // 手势2：伸食指
                    material.color.setHex(0xffaa00);
                } else {
                    gestureText.innerText = "EXPAND";    // 手势3：全张开
                    material.color.setHex(0xff00ff);
                }
            }
        });

        const cameraUtils = new Camera(videoElement, {
            onFrame: async () => { await hands.send({image: videoElement}); },
            width: 640, height: 480
        });
        cameraUtils.start();

        // --- 动画循环 ---
        function animate() {
            requestAnimationFrame(animate);

            // 粒子缓动效果
            const positions = geometry.attributes.position.array;
            const targets = geometry.attributes.target.array;

            for (let i = 0; i < particleCount; i++) {
                const i3 = i * 3;
                // 核心逻辑：粒子向“目标星型坐标 * 缩放”移动
                positions[i3] += (targets[i3] * spreadFactor - positions[i3]) * 0.1;
                positions[i3+1] += (targets[i3+1] * spreadFactor - positions[i3+1]) * 0.1;
                positions[i3+2] += (targets[i3+2] * spreadFactor - positions[i3+2]) * 0.1;
            }
            geometry.attributes.position.needsUpdate = true;

            // 整体跟随与旋转
            particleSystem.position.lerp(targetPos, 0.1);
            particleSystem.rotation.y += 0.005;
            particleSystem.rotation.z += 0.002;

            renderer.render(scene, camera);
        }
        animate();

        // 全屏逻辑
        document.getElementById('fullscreen-btn').onclick = () => {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        };

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
