<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 四角星手势交互系统</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        
        /* 磨砂玻璃星形 UI */
        #ui-layer {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 350px; height: 350px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            /* 四角星裁切路径 */
            clip-path: polygon(50% 0%, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0% 50%, 40% 40%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: none;
            display: flex; justify-content: center; align-items: center;
        }

        #gesture-label {
            color: white; font-size: 2rem; font-weight: 200; letter-spacing: 8px;
            text-shadow: 0 0 15px rgba(255,255,255,0.5);
        }

        #fullscreen-btn {
            position: absolute; bottom: 30px; right: 30px;
            padding: 10px 25px; background: rgba(255,255,255,0.1);
            color: white; border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px; cursor: pointer; pointer-events: auto;
        }

        #v-preview { position: absolute; top: 10px; left: 10px; width: 140px; border-radius: 10px; transform: scaleX(-1); opacity: 0.6; }
    </style>
</head>
<body>

<video id="v-preview" autoplay playsinline></video>
<div id="ui-layer"><div id="gesture-label">CORE</div></div>
<button id="fullscreen-btn">FULLSCREEN</button>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
    import * as THREE from 'three';

    // --- 场景初始化 ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);
    camera.position.z = 20;

    // --- 四角星粒子数学模型 ---
    const PARTICLE_COUNT = 12000;
    const geo = new THREE.BufferGeometry();
    const pos = new Float32Array(PARTICLE_COUNT * 3);
    const targetPos = new Float32Array(PARTICLE_COUNT * 3);
    const colors = new Float32Array(PARTICLE_COUNT * 3);

    function getFourPointStar(t) {
        // 使用 Astroid 曲线方程实现图二的四角星
        const angle = t * Math.PI * 2;
        const r = 8;
        // x = r * cos^3(t), y = r * sin^3(t) 这是标准的星形线
        const x = r * Math.pow(Math.cos(angle), 3);
        const y = r * Math.pow(Math.sin(angle), 3);
        return { x, y };
    }

    for (let i = 0; i < PARTICLE_COUNT; i++) {
        const i3 = i * 3;
        // 初始随机分布
        pos[i3] = (Math.random() - 0.5) * 50;
        pos[i3+1] = (Math.random() - 0.5) * 50;
        pos[i3+2] = (Math.random() - 0.5) * 10;

        // 计算目标四角星位置
        const t = Math.random();
        const star = getFourPointStar(t);
        targetPos[i3] = star.x;
        targetPos[i3+1] = star.y;
        targetPos[i3+2] = (Math.random() - 0.5) * 2;

        // 颜色：越靠近四个角越亮（青白交替）
        const isCorner = Math.abs(star.x) > 5 || Math.abs(star.y) > 5;
        colors[i3] = isCorner ? 1 : 0.4; 
        colors[i3+1] = isCorner ? 1 : 0.9;
        colors[i3+2] = 1;
    }

    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('target', new THREE.BufferAttribute(targetPos, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const mat = new THREE.PointsMaterial({
        size: 0.06,
        vertexColors: true,
        transparent: true,
        blending: THREE.AdditiveBlending,
        opacity: 0.8
    });

    const particles = new THREE.Points(geo, mat);
    scene.add(particles);

    // --- 手势追踪逻辑 ---
    const video = document.getElementById('v-preview');
    const label = document.getElementById('gesture-label');
    const uiLayer = document.getElementById('ui-layer');
    
    let currentSpread = 1.0;
    let lerpTargetPos = new THREE.Vector3();

    const hands = new Hands({locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
    hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.7 });

    hands.onResults((res) => {
        if (res.multiHandLandmarks && res.multiHandLandmarks[0]) {
            const lm = res.multiHandLandmarks[0];
            
            // 跟随手势
            lerpTargetPos.set((0.5 - lm[9].x) * 40, (0.5 - lm[9].y) * 25, 0);

            // 计算张合度 (4号和8号点距离)
            const d = Math.hypot(lm[8].x - lm[4].x, lm[8].y - lm[4].y);
            
            // 握拳(d<0.1) -> 核心凝聚；张开(d>0.4) -> 撑满屏幕
            currentSpread = THREE.MathUtils.mapLinear(d, 0.05, 0.45, 0.1, 4.0);
            
            // UI 反馈
            if (d < 0.15) {
                label.innerText = "CORE";
                uiLayer.style.transform = "translate(-50%, -50%) scale(0.5)";
            } else if (d > 0.35) {
                label.innerText = "EXPAND";
                uiLayer.style.transform = "translate(-50%, -50%) scale(2.0)";
            } else {
                label.innerText = "READY";
                uiLayer.style.transform = "translate(-50%, -50%) scale(1.0)";
            }
        }
    });

    const cam = new Camera(video, {
        onFrame: async () => { await hands.send({image: video}); },
        width: 640, height: 480
    });
    cam.start();

    // --- 渲染循环 ---
    function render() {
        requestAnimationFrame(render);

        const p = geo.attributes.position.array;
        const t = geo.attributes.target.array;

        for (let i = 0; i < PARTICLE_COUNT; i++) {
            const i3 = i * 3;
            // 核心公式：位置向 (目标形状 * 缩放倍率) 靠拢
            p[i3] += (t[i3] * currentSpread - p[i3]) * 0.1;
            p[i3+1] += (t[i3+1] * currentSpread - p[i3+1]) * 0.1;
            p[i3+2] += (t[i3+2] * currentSpread - p[i3+2]) * 0.1;
        }
        geo.attributes.position.needsUpdate = true;

        particles.position.lerp(lerpTargetPos, 0.1);
        particles.rotation.z += 0.005; // 基础旋转
        particles.rotation.y += 0.01 * currentSpread; // 扩散时加速旋转

        renderer.render(scene, camera);
    }
    render();

    // 全屏与自适应
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
    document.getElementById('fullscreen-btn').onclick = () => {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
    };
</script>
</body>
</html>
